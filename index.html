<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Seat Plan, Tolip Alexandria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --hdr:#11322C; --hdr-ink:#F3EEE3; --hdr-muted:#A9BDB5;
  --bg:#EEF0ED; --panel:#FFFFFF; --panel2:#F6F5F1; --ink:#1B2421; --muted:#6B7470; --line:#E2DED4;
  --gold:#B08D57; --gold-soft:#EADCC2; --gold-deep:#8A6A3A; --danger:#B4473A; --ok:#3E7A5A;
  --bride:#B96F7E; --groom:#3E5F88; --both:#9C8752;
  --canvas:#E6E9E5; --deck:#F1EEE7; --deck-edge:#C7B48E; --gridc:rgba(120,100,60,.08); --gridm:rgba(120,100,60,.18);
  --lawn:#C4D6AE; --lawn-edge:#98B37C; --pool:#8ECFE2; --pool-in:#B0DFEC; --pool-edge:#5A9FB8;
  --seaw:#A7CCDA; --seaw2:#8BB9CB; --chair:#FFFFFF; --chair-edge:#B7A27C; --tableline:#B8A278;
  --stage:#9D7E5E; --stage-line:#7C6247; --box:#56626A; --screen:#232F35; --kosha:#F5EADF; --kosha-edge:#B7916A;
  --nm:#2A2F2C; --title:#3A2E1C;
  font-family:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --hdr:#0B1D1A; --bg:#0D1513; --panel:#121C1A; --panel2:#182421; --ink:#ECE7DC; --muted:#98A29D; --line:#26332F;
    --canvas:#0E1715; --deck:#252621; --deck-edge:#6A5B3F; --gridc:rgba(255,235,200,.04); --gridm:rgba(255,235,200,.1);
    --lawn:#324529; --lawn-edge:#4E6A40; --pool:#1C5C72; --pool-in:#276E86; --pool-edge:#3B8DA8;
    --seaw:#14323F; --seaw2:#1B4152; --chair:#2E302B; --chair-edge:#9C865E; --tableline:#8E7A55;
    --kosha:#46392D; --stage:#6A5440; --stage-line:#8A6D4F; --box:#6D7C86; --screen:#0A1114;
    --nm:#E6E0D3; --title:#3A2E1C; --gold-soft:#4A3F2C;
  }
}
:root[data-theme="dark"]{
  --hdr:#0B1D1A; --bg:#0D1513; --panel:#121C1A; --panel2:#182421; --ink:#ECE7DC; --muted:#98A29D; --line:#26332F;
  --canvas:#0E1715; --deck:#252621; --deck-edge:#6A5B3F; --gridc:rgba(255,235,200,.04); --gridm:rgba(255,235,200,.1);
  --lawn:#324529; --lawn-edge:#4E6A40; --pool:#1C5C72; --pool-in:#276E86; --pool-edge:#3B8DA8;
  --seaw:#14323F; --seaw2:#1B4152; --chair:#2E302B; --chair-edge:#9C865E; --tableline:#8E7A55;
  --kosha:#46392D; --stage:#6A5440; --stage-line:#8A6D4F; --box:#6D7C86; --screen:#0A1114;
  --nm:#E6E0D3; --title:#3A2E1C; --gold-soft:#4A3F2C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);display:grid;grid-template-columns:1fr 368px;grid-template-rows:auto 1fr;height:100%;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.serif{font-family:"Cormorant Garamond",Georgia,serif}

header.top{grid-column:1 / -1;display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--hdr);color:var(--hdr-ink);min-width:0;position:relative}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);opacity:.7}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mono{width:40px;height:40px;flex:0 0 40px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:19px;font-style:italic;color:var(--gold-soft);letter-spacing:.02em}
.brand h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:25px;line-height:1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--hdr-muted);font-size:12px;margin-top:3px;white-space:nowrap}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:nowrap}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:6px 12px;border-radius:999px;border:1px solid rgba(176,141,87,.45);background:rgba(255,255,255,.04);font-size:13px;white-space:nowrap;color:var(--hdr-ink)}
.chip b{font-weight:600;font-variant-numeric:tabular-nums;color:#fff}
.chip.bad{border-color:#E08C7E;color:#F4B3A8}
.chip.bad b{color:#FFD2CA}
button.chip{cursor:pointer}

.stage{position:relative;overflow:hidden;background:var(--canvas);min-height:0;min-width:0}
.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;z-index:5;overflow-x:auto;scrollbar-width:none;pointer-events:none}
.toolbar::-webkit-scrollbar{display:none}
.tgroup{display:flex;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;pointer-events:auto;flex:0 0 auto;box-shadow:0 6px 18px -10px rgba(20,30,25,.35)}
.tb{border:0;background:transparent;padding:6px 11px;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap;min-height:32px}
.tb:hover{background:var(--panel2)}
.tb[aria-pressed="true"]{background:var(--hdr);color:var(--hdr-ink)}
.tb:disabled{opacity:.35;cursor:default}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .5s ease}
#svg *{vector-effect:non-scaling-stroke}
.stage.pan #svg{cursor:grabbing}
.stage.measure #svg,.stage.is-placing #svg{cursor:crosshair}
.stage.tilt #svg{transform:perspective(1500px) rotateX(50deg) scale(.92);transform-origin:50% 62%;pointer-events:none}
.tiltnote{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:var(--hdr);color:var(--hdr-ink);padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:6;white-space:nowrap}
.stage.tilt .tiltnote{display:block}
.scalebar{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);z-index:4;pointer-events:none}
.scalebar i{display:block;height:6px;border:1.5px solid var(--muted);border-top:0;margin-bottom:3px}
.zoomlbl{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--muted);z-index:4;pointer-events:none}
.marquee{position:absolute;border:1.5px dashed var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);pointer-events:none;display:none;z-index:4}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--hdr);color:var(--hdr-ink);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:7;max-width:90%;text-align:center}
.toast.show{opacity:1}
.placing{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:var(--hdr);color:var(--hdr-ink);padding:8px 8px 8px 16px;border-radius:999px;z-index:8;font-size:14px;white-space:nowrap;box-shadow:0 10px 30px -12px rgba(0,0,0,.5);border:1px solid var(--gold)}
.placing b{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:600;color:var(--gold-soft)}
.placing button{border:0;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-size:13px}
.stage.is-placing .placing{display:flex}

/* canvas */
.deck{fill:var(--deck);stroke:var(--deck-edge);stroke-width:1.5}
.gridl{stroke:var(--gridc);stroke-width:1;fill:none}
.gridm{stroke:var(--gridm);stroke-width:1;fill:none}
.seaw{fill:var(--seaw)}
.wave{fill:none;stroke:var(--seaw2);stroke-width:1.2}
.dimt{fill:var(--muted);font-size:.9px}
.seat{font-family:"Cormorant Garamond",serif;font-style:italic;fill:#2F6E8A;font-size:1.4px}
.ch{fill:var(--chair);stroke:var(--chair-edge);stroke-width:1}
.ch.f{stroke:rgba(0,0,0,.25)}
.ch.s-bride{fill:var(--bride)} .ch.s-groom{fill:var(--groom)} .ch.s-both{fill:var(--both)}
.ch.cur{stroke:var(--gold);stroke-width:3}
.t-top{stroke:var(--tableline);stroke-width:1.2}
.t-ring{fill:none;stroke:var(--gold);stroke-width:.8;opacity:.55}
.tnum{font-family:"Jost",sans-serif;font-weight:500;text-anchor:middle;dominant-baseline:central;fill:var(--gold-deep);letter-spacing:.02em}
.ttl{font-family:"Cormorant Garamond",serif;font-weight:600;font-style:italic;text-anchor:middle;dominant-baseline:central;fill:var(--title)}
.tocc{font-family:"Jost",sans-serif;text-anchor:middle;dominant-baseline:central;fill:#6F6250}
.nm{font-family:"Jost",sans-serif;font-weight:500;fill:var(--nm);dominant-baseline:central}
.nm.s-bride{fill:color-mix(in srgb,var(--bride) 70%,var(--nm))}
.nm.s-groom{fill:color-mix(in srgb,var(--groom) 70%,var(--nm))}
.il{font-size:.55px;font-weight:600;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.il.light{fill:#F6F0E4}
.il.halo{paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:none;fill:#1B2421}
.stage-b{fill:var(--stage);stroke:var(--stage-line);stroke-width:1.2}
.plank{stroke:var(--stage-line);stroke-width:.6;fill:none;opacity:.7}
.danceb{stroke:#6d6d6d;stroke-width:1.2}
.boxb{fill:var(--box);stroke:rgba(0,0,0,.3);stroke-width:1}
.screenb{fill:var(--screen);stroke:#000;stroke-width:1}
.kosha-b{fill:var(--kosha);stroke:var(--kosha-edge);stroke-width:1.2}
.kosha-s{fill:#C9A27C;stroke:var(--kosha-edge);stroke-width:1}
.stepb{fill:color-mix(in srgb,var(--kosha) 85%,#000);stroke:var(--kosha-edge);stroke-width:.8}
.buffetb{fill:#EDE7DA;stroke:#8C8068;stroke-width:1}
.dish{fill:#C3C8CC;stroke:#6F767C;stroke-width:.7}
.barb{fill:#5E4230;stroke:#3F2B1E;stroke-width:1}
.stool{fill:#3F2B1E}
.photob{fill:rgba(176,141,87,.10);stroke:var(--gold);stroke-width:1;stroke-dasharray:4 3}
.backdrop{stroke:#B96F7E;stroke-width:3;fill:none}
.archp{fill:#8E9B7A;stroke:#5E6B4C;stroke-width:1}
.flower{fill:#F3D2D6;stroke:#C98D98;stroke-width:.6}
.sofa{fill:#CDBDA5;stroke:#7E6F5A;stroke-width:1}
.ctable{fill:#8A7560;stroke:#5C4C3C;stroke-width:.8}
.frond{fill:#6F9A5A;stroke:#4C7440;stroke-width:.6}
.trunk{fill:#7A5B3A}
.pole{fill:#3D4A52;stroke:#20292E;stroke-width:1}
.poolb{fill:var(--pool);stroke:var(--pool-edge);stroke-width:1.5}
.poolin{fill:var(--pool-in)}
.poolw{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.2}
.lawnb{fill:var(--lawn);stroke:var(--lawn-edge);stroke-width:1}
.tentb{fill:rgba(255,255,255,.12);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:7 5;pointer-events:stroke}
.tentl{stroke:var(--muted);stroke-width:.8;stroke-dasharray:3 4;fill:none;pointer-events:none}
.rowbase{fill:none;stroke:var(--chair-edge);stroke-width:.8;stroke-dasharray:3 3;opacity:.7}
.hightop{fill:#FBF8F2;stroke:var(--tableline);stroke-width:1}
.cakeb{fill:#FDFBF6;stroke:var(--tableline);stroke-width:1}
.cake{fill:#F3D9DD;stroke:#C98D98;stroke-width:.8}
.locked .t-top,.locked .stage-b{stroke-dasharray:2 2}
#overlay,#night{pointer-events:none}
#overlay [data-handle]{pointer-events:auto}
.sel{fill:none;stroke:var(--gold);stroke-width:2}
.hdl{fill:var(--panel);stroke:var(--gold);stroke-width:2}
.hdl-hit{fill:transparent;cursor:pointer}
.hline{stroke:var(--gold);stroke-width:1.5}
.seatring{fill:none;stroke:var(--gold);stroke-width:2.5}
.bad{fill:rgba(180,71,58,.08);stroke:var(--danger);stroke-width:1.5;stroke-dasharray:5 4}
.walk{fill:rgba(62,122,90,.05);stroke:rgba(62,122,90,.5);stroke-width:1;stroke-dasharray:2 3}
.meas{stroke:#2F6E8A;stroke-width:2;stroke-dasharray:6 4}
.measdot{fill:#2F6E8A}
.meast{fill:#2F6E8A;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px;vector-effect:none}
.target .t-top{stroke:var(--gold);stroke-width:2.5}
svg.lod1 .nm{display:none}
svg.lod2 .tnum,svg.lod2 .ttl,svg.lod2 .tocc,svg.lod2 .il,svg.lod2 .dimt{display:none}

.stage.night{--canvas:#060D10}
.stage.night .deck{fill:#1B1E20;stroke:#3A3A33}
.stage.night .seaw{fill:#0A1F2B}
.stage.night .wave{stroke:#113143}
.stage.night .lawnb{fill:#1B2A18}
.stage.night .poolb{fill:#0D4A61}
.stage.night .poolin{fill:#13667F}
.stage.night .gridl,.stage.night .gridm{stroke:rgba(255,255,255,.03)}
.stage.night #items,.stage.night #zones{filter:brightness(.7) saturate(.85)}
.stage.night .nm,.stage.night .dimt,.stage.night .il{fill:#EDE3CF}
#night{display:none}
.stage.night #night{display:inline}
.bulb{fill:#FFE3A1}
.glow{fill:url(#glowG)}

/* panel */
aside.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;flex:0 0 auto}
.tab{flex:1;border:0;background:none;padding:13px 4px 11px;font-weight:500;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab .n{font-size:11px;color:var(--gold-deep);margin-left:3px}
.collapse{display:none;border:0;background:none;padding:0 8px;color:var(--muted);font-size:18px}
.pbody{overflow:auto;padding:16px 18px 28px;flex:1;min-height:0}
.pbody h2{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:600;margin:22px 0 8px;line-height:1.1}
.pbody h2:first-child{margin-top:0}
.pbody h3{font-size:13px;font-weight:600;margin:16px 0 6px;color:var(--muted)}
.pbody p.note{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 10px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pbtn{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 9px;font-size:13px;line-height:1.2;min-height:48px;transition:border-color .15s}
.pbtn:hover{border-color:var(--gold)}
.pbtn svg{flex:0 0 30px;height:30px}
.pbtn span small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row label{font-size:13px;color:var(--muted);min-width:78px}
.row input[type=number],.row input[type=text],.row input[type=search],.row select,.fld{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:14px}
.row input[type=range]{flex:1;accent-color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two>*{min-width:0}
.two .row label{min-width:auto}
#fRotN{max-width:72px;flex:0 0 72px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:500;min-height:36px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--hdr);color:var(--hdr-ink);border-color:var(--hdr)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12px}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 -3px 6px rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{outline:2px solid var(--gold);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.cap{font-size:12px;color:var(--muted)}
.meter{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--gold)}
.empty{color:var(--muted);font-size:14px;line-height:1.55}
.empty kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--both)}
.dot.s-bride{background:var(--bride)} .dot.s-groom{background:var(--groom)}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.fig{background:var(--panel2);border-radius:10px;padding:9px 8px}
.fig b{display:block;font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;line-height:1}
.fig span{font-size:11px;color:var(--muted)}
.seats{list-style:none;margin:6px 0;padding:0;border-top:1px solid var(--line)}
.seats li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;min-height:44px}
.seats li.cur{background:color-mix(in srgb,var(--gold) 12%,transparent);margin:0 -8px;padding:6px 8px;border-radius:8px}
.sn{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1px solid var(--chair-edge);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.sg{flex:1;min-width:0;display:flex;align-items:center;gap:7px;overflow:hidden}
.sg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg small{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.seats select{flex:1;min-width:0;padding:6px 8px;border:1px dashed var(--line);border-radius:8px;background:transparent;font-size:13px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:18px;width:30px;height:30px;border-radius:50%}
.x:hover{background:var(--panel2);color:var(--danger)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12px}
.fchip[aria-pressed="true"]{background:var(--hdr);color:var(--hdr-ink);border-color:var(--hdr)}
.glist{list-style:none;margin:0;padding:0}
.glist>li{border-bottom:1px solid var(--line)}
.grow{display:flex;align-items:center;gap:8px;padding:8px 0;min-height:48px}
.gmain{flex:1;min-width:0;display:flex;align-items:center;gap:9px;border:0;background:none;text-align:left;padding:0}
.gn{min-width:0}
.gn b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gn small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip{border:1px solid var(--gold);color:var(--gold-deep);background:color-mix(in srgb,var(--gold) 8%,var(--panel));border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}
.warn{color:var(--danger);font-size:12px}
.gedit{padding:4px 0 12px}
.glist>li[draggable="true"]{cursor:grab}
details.paste summary{cursor:pointer;font-size:13px;color:var(--gold-deep);margin:6px 0}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:9px;font-size:13px;font-family:inherit}
.saved{list-style:none;margin:0;padding:0}
.saved li{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.saved li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved li small{color:var(--muted)}

/* chart modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,17,.55);display:none;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.modal.open{display:flex;justify-content:center}
.sheet{background:var(--panel);width:min(1100px,100%);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.sheet header{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet header h2{font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:600;margin:0;flex:1;min-width:200px;line-height:1}
.sheet header h2 small{display:block;font-family:"Jost",sans-serif;font-size:13px;font-weight:400;color:var(--muted);margin-top:6px}
.sheet .sbody{overflow:auto;padding:22px}
.cards{columns:250px;column-gap:18px}
.card{break-inside:avoid;border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;margin:0 0 18px;background:var(--panel);position:relative}
.card::before{content:"";position:absolute;inset:4px;border:1px solid var(--gold-soft);border-radius:9px;pointer-events:none}
.card h4{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;font-style:italic;margin:0 0 2px;text-align:center}
.card .num{text-align:center;font-size:12px;color:var(--gold-deep);margin-bottom:8px}
.card ol{margin:0;padding:0;list-style:none;font-size:14px;line-height:1.75}
.card ol li{display:flex;gap:8px;align-items:center}
.card ol li small{margin-left:auto;color:var(--muted);font-size:12px}
.card ol li.e{color:var(--muted);font-style:italic}
.az{columns:260px;column-gap:26px;font-size:15px}
.az div{break-inside:avoid;display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line)}
.az div b{font-weight:500}
.az div span{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17px;color:var(--gold-deep);white-space:nowrap}
.az h5{font-family:"Cormorant Garamond",serif;font-size:26px;margin:14px 0 2px;color:var(--gold-deep);break-after:avoid}


/* smart + sheet */
.shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 4px}
.shp{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 2px 6px;font-size:11px;color:var(--muted);min-height:64px}
.shp svg{width:34px;height:34px}
.shp[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--panel));color:var(--ink)}
.ch.rsv{fill:transparent;stroke-dasharray:2 2}
.cmd{display:flex;gap:6px;margin:4px 0 6px}
.cmd input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--gold);border-radius:10px;background:var(--panel);font-size:14px}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.ex button{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 9px;font-size:11px;color:var(--muted)}
.capcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.capcard .big{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:600;line-height:1}
.capcard .big small{font-family:"Jost",sans-serif;font-size:13px;font-weight:400;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;display:flex;margin:6px 0 2px}
.bar i{display:block;height:100%}
.bar i.g{background:var(--groom)} .bar i.b{background:var(--bride)} .bar i.o{background:var(--both)} .bar i.x{background:repeating-linear-gradient(45deg,var(--gold-soft) 0 4px,transparent 4px 8px)}
.capline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.ins{list-style:none;margin:0;padding:0}
.ins li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
.ins li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:var(--ok)}
.ins li.warn::before{background:var(--gold)} .ins li.err::before{background:var(--danger)} .ins li.tip::before{background:var(--groom)}
.ins li div{flex:1;min-width:0}
.ins li .btn{flex:0 0 auto}
.log{font-size:12px;color:var(--muted);line-height:1.6;margin:0;padding-left:16px}
.sheetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--line)}
.sheetbar input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);min-width:180px}
.xl{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.xl th{position:sticky;top:0;background:var(--panel2);z-index:2;text-align:left;font-weight:600;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.xl th.nosort{cursor:default}
.xl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;height:34px;background:var(--panel)}
.xl td.rn{color:var(--muted);text-align:center;font-size:11px;padding:0 6px;background:var(--panel2);position:sticky;left:0;z-index:1}
.xl td input[type=text],.xl td input[type=number],.xl td select{width:100%;height:33px;border:0;background:transparent;padding:0 8px;font-size:13px;border-radius:0}
.xl td input:focus,.xl td select:focus{outline:2px solid var(--gold);outline-offset:-2px;background:color-mix(in srgb,var(--gold) 8%,var(--panel))}
.xl td.ro{padding:0 8px;color:var(--muted);white-space:nowrap}
.xl td.ck{text-align:center}
.xl tr.flag td input[data-c="name"]{color:var(--gold-deep);font-style:italic}
.xl tr.sel td{background:color-mix(in srgb,var(--gold) 10%,var(--panel))}
.sheetfoot{padding:10px 22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.sheet .sbody.xlwrap{padding:0}
/* build mode */
.lot{fill:url(#lotHatch);stroke:var(--muted);stroke-width:1;stroke-dasharray:6 5;opacity:.9}
.fedge{fill:none;stroke:var(--deck-edge);stroke-width:1.8}
.wedge{fill:none;stroke:#4E97B1;stroke-width:1.5}
.wall{fill:#3B3F3C;stroke:#222;stroke-width:.8}
.stage.night .wall{fill:#555A56}
.stage.night #floorG{filter:brightness(.55) saturate(.8)}
.door{fill:none;stroke:var(--gold-deep);stroke-width:1.2}
.doorl{stroke:var(--gold-deep);stroke-width:2}
.winb{fill:#DCEFF6;stroke:#4E97B1;stroke-width:1}
.thresh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.pillarb{fill:#8D877C;stroke:#4F4B44;stroke-width:1}
.bprev{fill:rgba(176,141,87,.18);stroke:var(--gold);stroke-width:2;stroke-dasharray:6 4}
.bprev.er{fill:rgba(180,71,58,.12);stroke:var(--danger)}
.bwall{stroke:var(--gold);stroke-linecap:square;opacity:.85}
.blbl{fill:var(--ink);font-weight:600;text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:4px;vector-effect:none}
.bhov{fill:rgba(176,141,87,.25);stroke:var(--gold);stroke-width:1}
.bdot{fill:var(--gold)}
.stage.building #items,.stage.building #tops,.stage.building #zones{opacity:.3;pointer-events:none}
.stage.building .gridl{stroke:rgba(90,80,60,.16)}
.stage.building .gridm{stroke:rgba(90,80,60,.34)}
.stage.building #svg{cursor:crosshair}
.stage.building .plan-only,.stage:not(.building) .build-only{display:none}
.stage.building.hand #svg{cursor:grab}
aside.panel.building .tab{display:none}
aside.panel .buildhead{display:none;flex:1;align-items:center;padding:10px 6px;font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:600}
aside.panel.building .buildhead{display:flex}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 4px 7px;font-size:12px;min-height:62px}
.tool svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.tool[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel));color:var(--gold-deep)}
.tool small{color:var(--muted);font-size:10px;line-height:1.1;text-align:center}
.mats{display:flex;gap:8px;flex-wrap:wrap}
.mat{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;font-size:11px;color:var(--muted);padding:0}
.mat i{display:block;width:42px;height:42px;border-radius:8px;border:1px solid var(--line)}
.mat[aria-pressed="true"] i{outline:2px solid var(--gold);outline-offset:2px}
.mat[aria-pressed="true"]{color:var(--ink)}
.maptbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.maptbl th,.maptbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.maptbl th{font-weight:600;color:var(--muted)}
.maptbl td.on{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 14px}
.mapgrid .row{flex-direction:column;align-items:stretch;gap:4px;margin:4px 0}
.mapgrid .row label{min-width:0!important}
.tblwrap{overflow-x:auto}
@media (max-width:860px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  header.top{padding:8px 12px;gap:6px;flex-wrap:wrap}
  .mono{display:none}
  .brand h1{font-size:21px}
  .brand small{display:none}
  .stats{margin-left:0;width:100%;overflow-x:auto;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .chip{font-size:12px;padding:4px 9px}
  aside.panel{border-left:0;border-top:1px solid var(--line);height:46vh;height:46dvh}
  aside.panel.collapsed{height:auto}
  aside.panel.collapsed .pbody{display:none}
  .collapse{display:block}
  .tab{font-size:13px}
  .toolbar{top:8px;left:8px;right:8px}
  .tb{padding:6px 9px}
  .placing{bottom:36px}
}
@media print{
  body>*:not(#chart){display:none!important}
  body{display:block;height:auto;overflow:visible;background:#fff}
  .modal{position:static;display:block;background:none;padding:0}
  .sheet{box-shadow:none;width:100%}
  .sheet header .btn{display:none}
  .sheet .sbody{overflow:visible}
}
@media (prefers-reduced-motion:reduce){#svg{transition:none}}
</style>

<body>
<header class="top">

</header>

<main class="stage" id="stage">

      <button class="tb" id="bWalk" aria-pressed="false" title="Show walkway clearance">Walkways</button>
      <button class="tb" id="bNight" aria-pressed="false" title="Evening lighting preview">Evening</button>

    <defs>

      </pattern>
      <pattern id="lotHatch" width="1" height="1" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1" height="1" fill="transparent"/><path d="M0 0V1" stroke="rgba(120,110,90,.18)" stroke-width=".06"/></pattern>
      <pattern id="m-d" width="2" height=".25" patternUnits="userSpaceOnUse"><rect width="2" height=".25" style="fill:var(--deck)"/><path d="M0 .245H2M1.3 0V.25" stroke="rgba(120,95,60,.22)" stroke-width=".02"/></pattern>
      <pattern id="m-m" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#F4F2EE"/><path d="M0 1.2C1 .9 1.6 1.8 2.6 1.4S3.6 .6 4 .9M.4 3.6C1.4 3.1 2 3.8 3.1 3.2" fill="none" stroke="#D9D3C8" stroke-width=".03"/><path d="M0 0H4V4" fill="none" stroke="#E6E1D8" stroke-width=".03"/></pattern>
      <pattern id="m-s" width="1" height="1" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#DAD4C8"/><path d="M0 .99H1M.99 0V1" stroke="#B9B1A2" stroke-width=".03"/></pattern>
      <pattern id="m-p" width="1" height="1" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#C9A273"/><path d="M0 0L.5 .5L0 1M.5 0L1 .5L.5 1M0 .5L.25 .25M.75 .75L1 .5" fill="none" stroke="#A9834F" stroke-width=".025"/></pattern>
      <pattern id="m-c" width=".8" height=".8" patternUnits="userSpaceOnUse"><rect width=".8" height=".8" fill="#7C2F3C"/><path d="M.4 .1L.7 .4L.4 .7L.1 .4Z" fill="none" stroke="#9A4453" stroke-width=".025"/><circle cx=".4" cy=".4" r=".04" fill="#C9A45F"/></pattern>
      <pattern id="m-g" width="1" height="1" patternUnits="userSpaceOnUse"><rect width="1" height="1" style="fill:var(--lawn)"/><circle cx=".2" cy=".3" r=".04" fill="rgba(60,100,40,.25)"/><circle cx=".7" cy=".75" r=".04" fill="rgba(60,100,40,.25)"/><circle cx=".65" cy=".2" r=".03" fill="rgba(60,100,40,.2)"/></pattern>

  <div class="marquee" id="marquee"></div>

/* ---------- floor, walls ---------- */
const CELL=.5;
const MATS={d:{name:'Deck',fill:'url(#m-d)'},m:{name:'Marble',fill:'url(#m-m)'},s:{name:'Stone',fill:'url(#m-s)'},p:{name:'Parquet',fill:'url(#m-p)'},c:{name:'Carpet',fill:'url(#m-c)'},g:{name:'Grass',fill:'url(#m-g)'},w:{name:'Water',fill:'url(#m-w)',block:true}};
function fDims(){return {cols:Math.max(1,Math.round(S.venue.w/CELL)),rows:Math.max(1,Math.round(S.venue.h/CELL))}}
function makeFloor(ch){const {cols,rows}=fDims();return {rows:Array.from({length:rows},()=>ch.repeat(cols))}}
function cellAt(cx,cy){const r=S.floor.rows[cy];return r&&cx>=0?(r[cx]||'.'):'.'}
function setCells(x0,y0,x1,y1,ch){
  const {cols,rows}=fDims();x0=Math.max(0,Math.min(x0,x1));x1=Math.min(cols-1,Math.max(x0,x1));y0=Math.max(0,Math.min(y0,y1));y1=Math.min(rows-1,Math.max(y0,y1));
  for(let y=y0;y<=y1;y++){const r=S.floor.rows[y];S.floor.rows[y]=r.slice(0,x0)+ch.repeat(x1-x0+1)+r.slice(x1+1)}
}
function fillRect(x0,y0,x1,y1,ch){setCells(Math.round(x0/CELL),Math.round(y0/CELL),Math.round(x1/CELL)-1,Math.round(y1/CELL)-1,ch)}
function paintCircle(x,y,r,ch){
  const {cols,rows}=fDims();
  for(let cy=Math.max(0,Math.floor((y-r)/CELL));cy<=Math.min(rows-1,Math.floor((y+r)/CELL));cy++){let row=S.floor.rows[cy].split('');let ch0=false;
    for(let cx=Math.max(0,Math.floor((x-r)/CELL));cx<=Math.min(cols-1,Math.floor((x+r)/CELL));cx++){if(Math.hypot((cx+.5)*CELL-x,(cy+.5)*CELL-y)<=r){row[cx]=ch;ch0=true}}
    if(ch0)S.floor.rows[cy]=row.join('')}
}
function resizeFloor(){
  const {cols,rows}=fDims(),full=S.floor.rows.every(r=>!r.includes('.')),pad=full?'d':'.';
  const R=S.floor.rows.slice(0,rows).map(r=>r.length>=cols?r.slice(0,cols):r+pad.repeat(cols-r.length));
  while(R.length<rows)R.push(pad.repeat(cols));S.floor.rows=R;
}
function floorArea(){let n=0;for(const r of S.floor.rows)for(const ch of r)if(ch!=='.'&&ch!=='w')n++;return n*CELL*CELL}
function onFloor(x,y){const ch=cellAt(Math.floor(x/CELL),Math.floor(y/CELL));return ch!=='.'&&ch!=='w'}
function samplePts(g){
  const pts=[[g.x,g.y]];
  if(g.c){const r=Math.max(0,g.r-.02),n=Math.max(8,Math.ceil(2*Math.PI*r/.4));for(let i=0;i<n;i++){const t=i/n*2*Math.PI;pts.push([g.x+r*Math.cos(t),g.y+r*Math.sin(t)])}return pts}
  const c=Math.cos(g.a),s=Math.sin(g.a),hw=Math.max(0,g.hw-.02),hh=Math.max(0,g.hh-.02);
  const nx=Math.max(1,Math.ceil(2*hw/.4)),ny=Math.max(1,Math.ceil(2*hh/.4));
  const P=(u,v)=>pts.push([g.x+u*c-v*s,g.y+u*s+v*c]);
  for(let i=0;i<=nx;i++){const u=-hw+2*hw*i/nx;P(u,-hh);P(u,hh)}
  for(let j=1;j<ny;j++){const v=-hh+2*hh*j/ny;P(-hw,v);P(hw,v)}
  return pts;
}
function wallGeom(w){const L=Math.hypot(w.x2-w.x1,w.y2-w.y1);return {c:0,x:(w.x1+w.x2)/2,y:(w.y1+w.y2)/2,hw:L/2+.1,hh:.1,a:Math.atan2(w.y2-w.y1,w.x2-w.x1)}}
function hitsWall(it){const T=TYPES[it.type];if(T.zone)return null;const g=geom(it,T.soft?0:chairPad(it)+.1);for(const w of S.walls)if(hit(g,wallGeom(w)))return w;return null}
function floorEdges(){
  // merged straight runs of the floor's outline, used to raise walls
  const {cols,rows}=fDims(),H={},V={};
  const solid=(x,y)=>{const ch=cellAt(x,y);return ch!=='.'&&ch!=='w'};
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(!solid(x,y))continue;
    if(!solid(x,y-1))(H['t'+y]=H['t'+y]||[]).push(x);if(!solid(x,y+1))(H['b'+(y+1)]=H['b'+(y+1)]||[]).push(x);
    if(!solid(x-1,y))(V['l'+x]=V['l'+x]||[]).push(y);if(!solid(x+1,y))(V['r'+(x+1)]=V['r'+(x+1)]||[]).push(y)}
  const segs=[];
  for(const [k,xs] of Object.entries(H)){const y=+k.slice(1);xs.sort((a,b)=>a-b);let a=xs[0],p=xs[0];for(let i=1;i<=xs.length;i++){if(i<xs.length&&xs[i]===p+1){p=xs[i];continue}segs.push({x1:a*CELL,y1:y*CELL,x2:(p+1)*CELL,y2:y*CELL});if(i<xs.length){a=p=xs[i]}}}
  for(const [k,ys] of Object.entries(V)){const x=+k.slice(1);ys.sort((a,b)=>a-b);let a=ys[0],p=ys[0];for(let i=1;i<=ys.length;i++){if(i<ys.length&&ys[i]===p+1){p=ys[i];continue}segs.push({x1:x*CELL,y1:a*CELL,x2:x*CELL,y2:(p+1)*CELL});if(i<ys.length){a=p=ys[i]}}}
  return segs;
}
function wallAround(){S.walls=[];S.doors=[];for(const sg of floorEdges())S.walls.push(Object.assign({id:'w'+(S.next++)},sg))}
function segDist(px,py,w){const dx=w.x2-w.x1,dy=w.y2-w.y1,L2=dx*dx+dy*dy||1;let t=((px-w.x1)*dx+(py-w.y1)*dy)/L2;t=Math.max(0,Math.min(1,t));return {d:Math.hypot(w.x1+t*dx-px,w.y1+t*dy-py),t}}

/* ---------- seats ---------- */
function rectCaps(it){const vert=it.h>it.w,L=vert?it.h:it.w,Sd=vert?it.w:it.h;return {vert,L,Sd,lc:Math.max(1,Math.floor(L/.6)),sc:Math.floor(Sd/.6)}}
function seatCap(it){
  const T=TYPES[it.type];
  if(T.shape==='round') return Math.max(2,Math.floor(Math.PI*it.w/.55));
  if(T.shape==='rect'){const c=rectCaps(it);return T.oneSide?c.lc:2*c.lc+2*c.sc}
  if(T.rows) return rowsLayout(it).n;
  if(T.standing) return 12;
  return 0;
}
function autoSeats(it){
  const T=TYPES[it.type];
  if(T.shape==='round') return seatCap(it);
  if(T.shape==='rect'){const c=rectCaps(it);if(T.oneSide)return c.lc;if(Math.abs(it.w-it.h)<.05)return seatCap(it);return 2*c.lc}
  if(T.rows) return rowsLayout(it).n;
  return it.seats||0;
}
function rowsLayout(it){
  const pitchX=.55,pitchY=.95,rows=Math.max(1,Math.floor((it.h+.05)/pitchY)),pts=[];
  if(it.w>=5.5){const half=Math.max(1,Math.floor((it.w-1.2)/2/pitchX));
    for(let r=0;r<rows;r++){const y=-it.h/2+pitchY*(r+.5);for(let c=0;c<half;c++){pts.push([-it.w/2+pitchX*(c+.5),y]);pts.push([it.w/2-pitchX*(c+.5),y])}}}
  else{const cols=Math.max(1,Math.floor(it.w/pitchX));
    for(let r=0;r<rows;r++){const y=-it.h/2+pitchY*(r+.5);for(let c=0;c<cols;c++)pts.push([-it.w/2+pitchX*(c+.5)+(it.w-cols*pitchX)/2,y])}}
  return {pts,n:pts.length};
}
// seat positions in the table's local frame, clockwise from top-left; a = chair angle (0 = back towards -y)
function seatSlots(it){
  const T=TYPES[it.type],n=it.seats,out=[];
  if(T.shape==='round'){const R=it.w/2+.32;for(let i=0;i<n;i++){const t=i*2*Math.PI/n-Math.PI/2;out.push({x:R*Math.cos(t),y:R*Math.sin(t),a:t*180/Math.PI+90})}return out}
  if(T.shape!=='rect')return out;
  const {vert,L,Sd,lc,sc}=rectCaps(it);
  let top=0,bot=0,rt=0,lf=0,rem=n;
  if(T.oneSide){top=Math.min(n,lc)}
  else{
    while(rem>0&&(top<lc||bot<lc)){if(top<=bot&&top<lc)top++;else if(bot<lc)bot++;else top++;rem--}
    while(rem>0&&(rt<sc||lf<sc)){if(rt<=lf&&rt<sc)rt++;else if(lf<sc)lf++;else rt++;rem--}
  }
  const d=.3;
  for(let i=0;i<top;i++)out.push({x:-L/2+L*(i+.5)/top,y:-Sd/2-d,a:0});
  for(let i=0;i<rt;i++)out.push({x:L/2+d,y:-Sd/2+Sd*(i+.5)/rt,a:90});
  for(let i=0;i<bot;i++)out.push({x:L/2-L*(i+.5)/bot,y:Sd/2+d,a:180});
  for(let i=0;i<lf;i++)out.push({x:-L/2-d,y:Sd/2-Sd*(i+.5)/lf,a:-90});
  if(vert)return out.map(p=>({x:-p.y,y:p.x,a:p.a+90}));
  return out;
}
function seatWorld(it,i){const p=seatSlots(it)[i];if(!p)return null;const c=Math.cos(rad(it.rot)),s=Math.sin(rad(it.rot));return {x:it.x+p.x*c-p.y*s,y:it.y+p.x*s+p.y*c}}
function computeSeatMap(){
  seatMap={};
  for(const g of S.guests){
    if(!g.t)continue;const it=byId(g.t),k=g.t+':'+g.s;
    if(!it||!TYPES[it.type].table||g.s==null||g.s>=it.seats||seatMap[k]){g.t=null;g.s=null;continue}
    seatMap[k]=g;
  }
}
function guestsAt(it){const a=[];for(let i=0;i<it.seats;i++)a.push(seatMap[it.id+':'+i]||null);return a}
function firstFree(it){for(let i=0;i<it.seats;i++)if(!seatMap[it.id+':'+i])return i;return -1}
function shortName(n,tight){n=(n||'').trim();if(n.length<=(tight?9:14))return n;const p=n.split(/\s+/);return p.length>1?(p[0]+' '+p[p.length-1][0]+'.'):n.slice(0,13)+'…'}
function tableName(it){return it.title?it.title:('Table '+tableNo(it))}
function tableNo(it){const m=/^T?(\d+)$/.exec(it.label||'');return m?m[1]:(it.label||'')}

/* ---------- geometry ---------- */
function chairPad(it){const T=TYPES[it.type];return T.table?CHAIRZ:(it.type==='bar'?.55:0)}
function isCircle(it){return !!TYPES[it.type].uniform}
function geom(it,pad){
  if(isCircle(it))return {c:1,x:it.x,y:it.y,r:it.w/2+pad};
  if(TYPES[it.type].oneSide){ // chairs only on one side: shift box
    const a=rad(it.rot),vert=it.h>it.w;let hw=it.w/2+pad*(vert?1:0),hh=it.h/2+pad*(vert?0:1);
    // chair side extends, far side only aisle
    return {c:0,x:it.x,y:it.y,hw:vert?hw:it.w/2+pad*.5,hh:vert?it.h/2+pad*.5:hh,a};
  }
  return {c:0,x:it.x,y:it.y,hw:it.w/2+pad,hh:it.h/2+pad,a:rad(it.rot)};
}
function corners(g){const c=Math.cos(g.a),s=Math.sin(g.a);return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([u,v])=>{const lx=u*g.hw,ly=v*g.hh;return [g.x+lx*c-ly*s,g.y+lx*s+ly*c]})}
function hitCO(ci,o){const dx=ci.x-o.x,dy=ci.y-o.y,c=Math.cos(-o.a),s=Math.sin(-o.a);const lx=dx*c-dy*s,ly=dx*s+dy*c;const cx=Math.max(-o.hw,Math.min(o.hw,lx)),cy=Math.max(-o.hh,Math.min(o.hh,ly));return Math.hypot(lx-cx,ly-cy)<ci.r-1e-3}
function hitOO(a,b){
  const A=corners(a),B=corners(b),axes=[];
  for(const g of [a,b]){axes.push([Math.cos(g.a),Math.sin(g.a)]);axes.push([-Math.sin(g.a),Math.cos(g.a)])}
  for(const [ax,ay] of axes){let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for(const [x,y] of A){const p=x*ax+y*ay;a0=Math.min(a0,p);a1=Math.max(a1,p)}
    for(const [x,y] of B){const p=x*ax+y*ay;b0=Math.min(b0,p);b1=Math.max(b1,p)}
    if(a1<=b0+1e-3||b1<=a0+1e-3)return false}
  return true;
}
function hit(a,b){if(a.c&&b.c)return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r-1e-3;if(a.c)return hitCO(a,b);if(b.c)return hitCO(b,a);return hitOO(a,b)}
function outOfBounds(it){
  if(TYPES[it.type].zone)return false;
  return samplePts(geom(it,chairPad(it))).some(([x,y])=>!onFloor(x,y));
}
function pairConflict(a,b){
  const Ta=TYPES[a.type],Tb=TYPES[b.type];
  if(Ta.zone==='soft'||Tb.zone==='soft'||Ta.zone==='over'||Tb.zone==='over')return false;
  if(Ta.zone&&Tb.zone)return false;
  if(Ta.soft&&Tb.soft)return false;
  const half=S.venue.aisle/2;
  if(Ta.soft&&!Tb.zone)return hit(geom(a,0),geom(b,chairPad(b)));
  if(Tb.soft&&!Ta.zone)return hit(geom(b,0),geom(a,chairPad(a)));
  const pa=Ta.zone?0:chairPad(a)+half,pb=Tb.zone?0:chairPad(b)+half;
  return hit(geom(a,pa),geom(b,pb));
}
function computeConflicts(){
  conflicts=new Set();const it=S.items;
  for(let i=0;i<it.length;i++){
    if(outOfBounds(it[i])||(S.walls.length&&hitsWall(it[i])))conflicts.add(it[i].id);
    for(let j=i+1;j<it.length;j++)if(pairConflict(it[i],it[j])){conflicts.add(it[i].id);conflicts.add(it[j].id)}
  }
}
function canPlace(c){if(outOfBounds(c)||(S.walls.length&&hitsWall(c)))return false;for(const o of S.items)if(o.id!==c.id&&pairConflict(c,o))return false;return true}

/* ---------- items ---------- */
function nextTableNo(){let m=0;for(const i of S.items){const k=/^T(\d+)$/.exec(i.label||'');if(k)m=Math.max(m,+k[1])}return m+1}
function make(type,o={}){
  const T=TYPES[type],w=o.w??T.w,h=o.h??(T.uniform?w:T.h);
  const it={id:'i'+(S.next++),type,x:o.x??0,y:o.y??0,w,h,rot:o.rot??0,seats:0,label:o.label??'',title:o.title??'',color:o.color??'ivory',locked:false};
  it.seats=o.seats??autoSeats(it);
  if(T.standing&&o.seats==null)it.seats=4;
  if(T.table&&!it.label)it.label='T'+nextTableNo();
  return it;
}
function presetMake(key,o={}){const p=PRESETS.find(p=>p.key===key);const it=make(p.type,Object.assign({w:p.w,h:p.h,seats:p.seats},o));if(key==='sweet'&&!o.title)it.title='The couple';if(key==='head'&&!o.title)it.title='Head table';return it}

function chairEl(x,y,a,cls,tid,i){

}
function labelEl(it,text,cls='il',fs){
  const size=fs||Math.max(.28,Math.min(.62,Math.min(it.w,it.h)*.32));

/* ---------- stats ---------- */
function tally(){let seated=0,standing=0,tables=0;for(const it of S.items){const T=TYPES[it.type];if(T.table){seated+=it.seats;tables++}else if(T.rows)seated+=it.seats;else if(T.standing)standing+=it.seats}return {seated,standing,tables}}

function updateStats(){

    `<button class="chip ${n?'bad':''}" id="bIssues" title="Items too close together, against walls, or off the floor"><b>${n}</b> ${n===1?'issue':'issues'}</button>`;
  $('#vname').textContent=S.venue.couple?S.venue.couple:'Wedding seat plan';

function placeFree(it,cx,cy){

  for(let rr=.5;rr<Math.max(S.venue.w,S.venue.h);rr+=.5){const n=Math.max(8,Math.round(rr*6));
    for(let i=0;i<n;i++){const t=i/n*2*Math.PI;it.x=Math.round((cx+rr*Math.cos(t))*2)/2;it.y=Math.round((cy+rr*Math.sin(t))*2)/2;if(canPlace(it))return true}}

}

function addGrid(key,rows,cols,gap){

    const pw=probe.w+2*chairPad(probe)+gap,ph=(isCircle(probe)?probe.w:probe.h)+2*chairPad(probe)+gap,ids=[];
    for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){const it=presetMake(key);it.x=f(c.x+(q-(cols-1)/2)*pw);it.y=f(c.y+(r-(rows-1)/2)*ph);S.items.push(it);ids.push(it.id)}
    sel=new Set(ids);selSeat=null});

/* ---------- templates ---------- */
function frame(){
  const side=S.venue.sea==='none'?'top':S.venue.sea,W=S.venue.w,H=S.venue.h;
  const A=(side==='top'||side==='bottom')?W:H,D=(side==='top'||side==='bottom')?H:W,rot={top:0,bottom:180,left:-90,right:90}[side];
  const P=(u,d)=>{if(side==='top')return{x:u*W,y:d};if(side==='bottom')return{x:W-u*W,y:H-d};if(side==='left')return{x:d,y:H-u*H};return{x:W-d,y:u*H}};
  return {A,D,rot,P};
}
function fillTables(key,target,focus,countMode){
  const probe=presetMake(key);S.next--;
  const circ=isCircle(probe),footX=(circ?probe.w:Math.max(probe.w,probe.h))+2*chairPad(probe),footY=(circ?probe.w:Math.min(probe.w,probe.h))+2*chairPad(probe);
  // leave room for the guest names written outside the chairs
  const pitchX=footX+S.venue.aisle+(circ?.15:.8),pitchY=footY+S.venue.aisle+(circ?.15:2.2),cands=[],W=S.venue.w,H=S.venue.h;
  const side=S.venue.sea,swap=side==='left'||side==='right';
  const px=swap?pitchY:pitchX,py=swap?pitchX:pitchY,fx=swap?footY:footX,fy=swap?footX:footY;
  let row=0;for(let y=fy/2+.2;y<H;y+=(circ?py*.88:py),row++)for(let x=fx/2+.2+(circ&&row%2?px/2:0);x<W;x+=px)cands.push([x,y]);
  cands.sort((a,b)=>Math.hypot(a[0]-focus.x,a[1]-focus.y)-Math.hypot(b[0]-focus.x,b[1]-focus.y));
  let got=0,placed=0;const out=[];
  for(const [x,y] of cands){if(countMode?placed>=target:got>=target)break;
    const it=presetMake(key,{x:f(x),y:f(y),rot:(!isCircle(probe)?frame().rot:0)});
    if(canPlace(it)){S.items.push(it);got+=it.seats;placed++;out.push(it)}else S.next--}
  return out;
}
function addAt(type,u,d,o={}){const F=frame(),p=F.P(u,d),key=o.key;delete o.key;const it=key?presetMake(key,Object.assign({rot:F.rot},o)):make(type,Object.assign({rot:F.rot},o));placeFree(it,f(p.x),f(p.y));S.items.push(it);return it}
function perimeterLights(){const W=S.venue.w,H=S.venue.h;for(let x=1;x<=W-1;x+=Math.max(6,(W-2)/Math.round((W-2)/12)))for(const y of [.6,H-.6]){const it=make('light');placeFree(it,f(x),y);S.items.push(it)}}
function renumberSilently(){
  const key=i=>{const s=S.venue.sea;if(s==='bottom')return [S.venue.h-i.y,S.venue.w-i.x];if(s==='left')return [i.x,S.venue.h-i.y];if(s==='right')return [S.venue.w-i.x,i.y];return [i.y,i.x]};
  const tabs=S.items.filter(i=>TYPES[i.type].table);
  tabs.sort((a,b)=>{const A=key(a),B=key(b);return (Math.round(A[0]/3)-Math.round(B[0]/3))||A[1]-B[1]});
  tabs.forEach((t,k)=>t.label='T'+(k+1));
}

          const p=F.P(u,d),it=make('rows',{w:bw,h:bh,rot:F.rot});it.x=f(p.x);it.y=f(p.y);if(canPlace(it)){S.items.push(it);got+=it.seats}else S.next--}

/* ---------- guests ---------- */
function addGuest(o){const g={id:'g'+(S.gnext++),name:String(o.name).trim(),side:o.side||'both',group:(o.group||'').trim(),meal:o.meal||'',rsvp:o.rsvp||'yes',notes:o.notes||'',rel:o.rel||'',hh:o.hh||'',kid:!!o.kid,pri:o.pri||0,confirm:!!o.confirm,t:null,s:null};inferGuest(g);S.guests.push(g);return g}
function assign(gid,tid,s){
  const g=gById(gid),it=byId(tid);if(!g||!it)return;
  if(s==null||s<0)s=firstFree(it);
  if(s<0){toast(`${tableName(it)} is full. Add a seat or choose another table.`);return false}
  mutate(()=>{
    const other=seatMap[tid+':'+s];
    if(other&&other.id!==gid){other.t=g.t;other.s=g.s} // swap
    g.t=tid;g.s=s;
    if(g.rsvp==='no')g.rsvp='yes';
  });
  toast(`${g.name} seated at ${tableName(it)}, seat ${s+1}.`);
  return true;
}
function unseat(gid){const g=gById(gid);if(!g)return;mutate(()=>{g.t=null;g.s=null})}
function startPlacing(gid){
  const g=gById(gid);if(!g)return;placing=gid;stage.classList.add('is-placing');$('#placingName').textContent=g.name;renderItems();
  if(window.matchMedia('(max-width:860px)').matches){$('#panel').classList.add('collapsed');$('#bCollapse').textContent='▴'}
}
function stopPlacing(){placing=null;stage.classList.remove('is-placing');renderItems()}
$('#placingCancel').onclick=stopPlacing;
function findGuest(gid){
  const g=gById(gid);if(!g||!g.t)return;const it=byId(g.t);const p=seatWorld(it,g.s);
  sel=new Set([it.id]);selSeat={tid:it.id,s:g.s};renderItems();centerOn(p.x,p.y,34);setTab('edit');
}
function autoSeat(){
  const todo=S.guests.filter(g=>!g.t&&g.rsvp!=='no');
  if(!todo.length){toast('Everyone who is coming already has a seat.');return}
  mutate(()=>{
    computeSeatMap();
    const tables=S.items.filter(i=>TYPES[i.type].table);
    const focus=S.items.find(i=>i.type==='kosha'||i.type==='head'||i.type==='stage')||{x:S.venue.w/2,y:0};
    tables.sort((a,b)=>Math.hypot(a.x-focus.x,a.y-focus.y)-Math.hypot(b.x-focus.x,b.y-focus.y));
    const groups={};for(const g of todo){const k=(g.group||SIDES[g.side]||'Guests');(groups[k]=groups[k]||[]).push(g)}
    const order=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);
    const free=t=>{let n=0;for(let i=0;i<t.seats;i++)if(!seatMap[t.id+':'+i])n++;return n};
    const seatIn=(g,t)=>{const s=firstFree(t);if(s<0)return false;g.t=t.id;g.s=s;seatMap[t.id+':'+s]=g;return true};
    for(const [name,list] of order){
      let rest=list.slice();
      // tables already named for this group, then tables already holding this group
      const pref=tables.filter(t=>(t.title||'').toLowerCase()===name.toLowerCase()||guestsAt(t).some(x=>x&&(x.group||SIDES[x.side])===name));
      for(const t of pref){while(rest.length&&free(t)>0)seatIn(rest.shift(),t)}
      while(rest.length){
        const fit1=tables.find(t=>free(t)>=rest.length&&guestsAt(t).every(x=>!x));
        const t=fit1||tables.find(t=>free(t)>=Math.min(rest.length,4)&&guestsAt(t).every(x=>!x))||tables.slice().sort((a,b)=>free(b)-free(a))[0];
        if(!t||free(t)===0)break;
        if(!t.title&&guestsAt(t).every(x=>!x)&&name!=='Guests')t.title=name;
        while(rest.length&&free(t)>0)seatIn(rest.shift(),t);
      }
    }
  });
  const left=S.guests.filter(g=>!g.t&&g.rsvp!=='no').length;
  toast(left?`Seated by group. ${left} still need a seat; add more tables.`:'Everyone is seated, with groups kept together.');
}
function parseGuestLines(txt){
  const out=[];for(const line of txt.split(/\r?\n/)){const p=line.split(/[,\t;]/).map(s=>s.trim());if(!p[0])continue;
    const side=(p[1]||'').toLowerCase().startsWith('b')&&!(p[1]||'').toLowerCase().startsWith('bo')?'bride':(p[1]||'').toLowerCase().startsWith('g')?'groom':'both';
    const meal=MEALS.find(m=>m.toLowerCase()===(p[3]||'').toLowerCase())||'';
    out.push({name:p[0],side,group:p[2]||'',meal})}
  return out;
}
function sampleGuests(){
  const first=['Nour','Omar','Mariam','Youssef','Salma','Karim','Hana','Ahmed','Farida','Mostafa','Laila','Tarek','Yasmin','Hassan','Dina','Amr','Rana','Sherif','Malak','Khaled','Nada','Ali','Jana','Mahmoud','Habiba','Ziad','Reem','Adham','Mona','Seif','Aya','Hesham','Nadine','Ibrahim','Rahma','Wael','Lina','Sameh','Heba','Marwan'];
  const last=['Hassan','El Sayed','Abdelrahman','Farouk','Mansour','Naguib','Soliman','Zaki','Fahmy','Hegazy','Shawky','Ragab','Lotfy','Badawi','Gamal','Kamel','Othman','Sabry','Hamdy','Rizk'];
  const groups=[["Bride's family",'bride',22],["Groom's family",'groom',22],["Bride's friends",'bride',18],["Groom's friends",'groom',18],['Work, bride','bride',10],['Work, groom','groom',10],['Neighbours','both',8],['University','both',12]];
  let k=0;const rs=['yes','yes','yes','yes','yes','yes','pending','pending','no'];
  mutate(()=>{for(const [grp,side,n] of groups)for(let i=0;i<n;i++){k++;addGuest({name:first[(k*7)%first.length]+' '+last[(k*3+i)%last.length],side,group:grp,meal:MEALS[(k*3)%(grp.includes('family')?5:4)],rsvp:rs[(k*11)%rs.length]})}});
  toast(`${k} sample guests added. Try Auto-seat by group.`);
}

/* ---------- selection ops ---------- */
function selItems(){return [...sel].map(byId).filter(Boolean)}
function groupCenter(items){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const i of items){x0=Math.min(x0,i.x);y0=Math.min(y0,i.y);x1=Math.max(x1,i.x);y1=Math.max(y1,i.y)}return {x:(x0+x1)/2,y:(y0+y1)/2}}
function normRot(r){return f(((r+180)%360+360)%360-180)}
function rotateGroup(deg){const its=selItems().filter(i=>!i.locked);if(!its.length)return;
  mutate(()=>{const c=groupCenter(its),a=rad(deg),co=Math.cos(a),sn=Math.sin(a);for(const i of its){const dx=i.x-c.x,dy=i.y-c.y;i.x=f(c.x+dx*co-dy*sn);i.y=f(c.y+dx*sn+dy*co);i.rot=normRot(i.rot+deg)}})}
function duplicateSel(){const its=selItems();if(!its.length)return;
  mutate(()=>{const ids=[];for(const i of its){const c=JSON.parse(JSON.stringify(i));c.id='i'+(S.next++);c.x=f(i.x+2);c.y=f(i.y+2);c.locked=false;if(TYPES[c.type].table)c.label='T'+nextTableNo();S.items.push(c);ids.push(c.id)}sel=new Set(ids);selSeat=null})}
function deleteSel(){const its=selItems().filter(i=>!i.locked);if(!its.length){if(sel.size)toast('Locked items stay put. Unlock them first.');return}
  const seated=its.reduce((n,i)=>n+guestsAt(i).filter(Boolean).length,0);
  mutate(()=>{const ids=new Set(its.map(i=>i.id));S.items=S.items.filter(i=>!ids.has(i.id));sel=new Set();selSeat=null});
  if(seated)toast(`${seated} ${seated===1?'guest is':'guests are'} back on the unseated list. Undo brings them back.`)}
function align(mode){const its=selItems().filter(i=>!i.locked);if(its.length<2)return;
  mutate(()=>{const xs=its.map(i=>i.x),ys=its.map(i=>i.y);const v={left:Math.min(...xs),right:Math.max(...xs),cx:(Math.min(...xs)+Math.max(...xs))/2,top:Math.min(...ys),bottom:Math.max(...ys),cy:(Math.min(...ys)+Math.max(...ys))/2}[mode];
    for(const i of its){if(['left','right','cx'].includes(mode))i.x=f(v);else i.y=f(v)}})}
function distribute(axis){const its=selItems().filter(i=>!i.locked);if(its.length<3)return;
  mutate(()=>{its.sort((a,b)=>a[axis]-b[axis]);const a=its[0][axis],b=its[its.length-1][axis];its.forEach((i,k)=>i[axis]=f(a+(b-a)*k/(its.length-1)))})}
function renumber(){mutate(renumberSilently);toast('Tables renumbered from the sea side back.')}

const pointers=new Map();let drag=null,pinch=null;
svg.addEventListener('pointerdown',e=>{
  if(tilt)return;
  svg.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){if(drag&&drag.pre&&drag.moved)pushUndo(drag.pre);drag=null;hideMarquee();
    const [a,b]=[...pointers.values()],r=svg.getBoundingClientRect();pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top,v:{...view}};return}
  if(pointers.size>2)return;
  const w=toWorld(e);
  if(mode==='build'){buildDown(e,w);return}
  if(tool==='measure'){measure={a:snapPt(w),b:snapPt(w)};drag={mode:'measure'};renderOverlay();return}
  const h=e.target.closest('[data-handle]');
  if(h){drag={mode:h.dataset.handle,id:h.dataset.id,pre:snapshot(),moved:false,start:w};return}
  const g=e.target.closest('.it'),seatEl=e.target.closest('[data-seat]');
  if(placing&&g){const it=byId(g.dataset.id);
    if(TYPES[it.type].table){drag={mode:'place',tid:it.id,seat:seatEl?+seatEl.dataset.seat:null,sx:e.clientX,sy:e.clientY};return}}
  if(g&&tool!=='box'){
    const id=g.dataset.id;
    if(e.shiftKey||e.metaKey||e.ctrlKey){sel.has(id)?sel.delete(id):sel.add(id)}else if(!sel.has(id))sel=new Set([id]);
    const its=selItems().filter(i=>!i.locked);
    drag={mode:'move',pre:snapshot(),moved:false,start:w,lead:id,seat:seatEl?+seatEl.dataset.seat:null,orig:its.map(i=>({id:i.id,x:i.x,y:i.y}))};
    renderOverlay();return;
  }
  if(tool==='box'||e.shiftKey){drag={mode:'marquee',sx:w.sx,sy:w.sy,add:e.shiftKey};return}
  drag={mode:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty,moved:false};stage.classList.add('pan');
});
svg.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)){if(mode==='build'&&e.pointerType==='mouse'){hover=toWorld(e);renderOverlay()}return}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size>=2){const [a,b]=[...pointers.values()],r=svg.getBoundingClientRect();
    const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top,ns=Math.max(2,Math.min(200,pinch.v.s*d/pinch.d));
    view.s=ns;view.tx=mx-(pinch.mx-pinch.v.tx)*ns/pinch.v.s;view.ty=my-(pinch.my-pinch.v.ty)*ns/pinch.v.s;applyView();return}
  if(!drag)return;const w=toWorld(e);
  if(drag.mode.startsWith('b-')){hover=w;buildMove(e,w);return}
  if(drag.mode==='place'){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6)drag.cancel=true;return}
  if(drag.mode==='pan'){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;view.tx=drag.tx+dx;view.ty=drag.ty+dy;applyView();return}
  if(drag.mode==='measure'){measure.b=snapPt(w);renderOverlay();return}
  if(drag.mode==='marquee'){const m=$('#marquee'),x=Math.min(drag.sx,w.sx),y=Math.min(drag.sy,w.sy);
    Object.assign(m.style,{display:'block',left:x+'px',top:y+'px',width:Math.abs(w.sx-drag.sx)+'px',height:Math.abs(w.sy-drag.sy)+'px'});drag.ex=w.sx;drag.ey=w.sy;return}
  if(drag.mode==='move'){
    let dx=w.x-drag.start.x,dy=w.y-drag.start.y;if(!drag.moved&&Math.hypot(dx,dy)*view.s<5)return;drag.moved=true;
    const lead=drag.orig.find(o=>o.id===drag.lead)||drag.orig[0];if(!lead)return;
    if(snap&&!e.altKey){const nx=Math.round((lead.x+dx)*2)/2,ny=Math.round((lead.y+dy)*2)/2;dx=nx-lead.x;dy=ny-lead.y}
    for(const o of drag.orig){const it=byId(o.id);it.x=f(o.x+dx);it.y=f(o.y+dy);const gg=document.getElementById('g-'+it.id);if(gg)gg.setAttribute('transform',`translate(${it.x} ${it.y}) rotate(${it.rot})`)}
    renderLive();return}
  const it=byId(drag.id);if(!it)return;
  if(drag.mode==='rot'){let a=Math.atan2(w.y-it.y,w.x-it.x)*180/Math.PI+90;if(snap&&!e.altKey)a=Math.round(a/15)*15;it.rot=normRot(a);drag.moved=true;rerenderItem(it);renderLive();refreshEditValues();return}
  if(drag.mode==='scale'){const T=TYPES[it.type],dx=w.x-it.x,dy=w.y-it.y,c=Math.cos(rad(-it.rot)),s=Math.sin(rad(-it.rot));
    const lx=Math.abs(dx*c-dy*s),ly=Math.abs(dx*s+dy*c),q=v=>Math.max(T.min,Math.min(T.max,snap&&!e.altKey?Math.round(v*10)/10:f(v)));
    if(T.uniform){const d=q(Math.hypot(lx,ly)*Math.SQRT2);it.w=it.h=d}else{it.w=q(2*lx);it.h=q(2*ly)}
    if(T.table||T.rows)it.seats=autoSeats(it);drag.moved=true;computeSeatMap();rerenderItem(it);renderLive();refreshEditValues()}
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pinch){if(pointers.size<2)pinch=null;return}
  if(!drag)return;const d=drag;drag=null;stage.classList.remove('pan');
  if(d.mode.startsWith('b-')){buildUp(d);return}
  if(d.mode==='pan'&&mode==='build')return;
  if(d.mode==='place'){if(!d.cancel){const gid=placing;const ok=assign(gid,d.tid,d.seat);if(ok!==false)stopPlacing()}return}
  if(d.mode==='pan'&&!d.moved&&(sel.size||selSeat)){sel=new Set();selSeat=null;renderItems();renderOverlay();renderPanel()}
  if(d.mode==='marquee'){hideMarquee();if(d.ex!=null){
    const x0=(Math.min(d.sx,d.ex)-view.tx)/view.s,x1=(Math.max(d.sx,d.ex)-view.tx)/view.s,y0=(Math.min(d.sy,d.ey)-view.ty)/view.s,y1=(Math.max(d.sy,d.ey)-view.ty)/view.s;
    const hits=S.items.filter(i=>!TYPES[i.type].zone&&i.x>=x0&&i.x<=x1&&i.y>=y0&&i.y<=y1).map(i=>i.id);
    sel=d.add?new Set([...sel,...hits]):new Set(hits);selSeat=null;renderOverlay();if(sel.size)setTab('edit');else renderPanel()}}
  if(d.mode==='measure'){renderOverlay();const a=measure.a,b=measure.b;if(a&&b&&Math.hypot(a.x-b.x,a.y-b.y)>.05)toast(`${Math.hypot(a.x-b.x,a.y-b.y).toFixed(2)} m`)}
  if(d.mode==='move'&&!d.moved){
    const prev=selSeat;selSeat=(d.seat!=null&&sel.size===1)?{tid:d.lead,s:d.seat}:null;
    if(prev&&byId(prev.tid))rerenderItem(byId(prev.tid));
    if(selSeat)rerenderItem(byId(selSeat.tid));
    renderOverlay();setTab('edit');
    if(selSeat){const row=document.querySelector(`.seats li[data-i="${selSeat.s}"]`);if(row)row.scrollIntoView({block:'center'})}
  }
  if((d.mode==='move'||d.mode==='rot'||d.mode==='scale')&&d.moved){pushUndo(d.pre);renderAll();renderPanel()}
}

function hideMarquee(){$('#marquee').style.display='none'}
function snapPt(w){if(!snap)return {x:w.x,y:w.y};let best=null,bd=12/view.s;for(const it of S.items){const d=Math.hypot(it.x-w.x,it.y-w.y);if(d<bd){bd=d;best={x:it.x,y:it.y}}}return best||{x:Math.round(w.x*4)/4,y:Math.round(w.y*4)/4}}
svg.addEventListener('wheel',e=>{e.preventDefault();if(tilt)return;const r=svg.getBoundingClientRect();
  if(e.ctrlKey||Math.abs(e.deltaY)>=Math.abs(e.deltaX))zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)));else{view.tx-=e.deltaX;applyView()}},{passive:false});

function setMode(m){
  mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  stage.classList.toggle('building',m==='build');$('#panel').classList.toggle('building',m==='build');
  stage.classList.toggle('hand',m==='build'&&bTool==='hand');
  if(placing)stopPlacing();sel=new Set();selSeat=null;measure=null;hover=null;
  if(m==='build'){if(tilt)$('#bTilt').click();toast('Build mode. Drag to lay floor, draw walls on the grid. Two fingers or Move view to pan.')}
  renderItems();renderOverlay();renderPanel();$('#panel').classList.remove('collapsed');
}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function cellOf(w){const {cols,rows}=fDims();return {x:Math.max(0,Math.min(cols-1,Math.floor(w.x/CELL))),y:Math.max(0,Math.min(rows-1,Math.floor(w.y/CELL)))}}
function snapV(w){return {x:Math.max(0,Math.min(S.venue.w,Math.round(w.x/CELL)*CELL)),y:Math.max(0,Math.min(S.venue.h,Math.round(w.y/CELL)*CELL))}}
function constrain(a,b){let dx=b.x-a.x,dy=b.y-a.y;
  if(Math.abs(dx)>2*Math.abs(dy))dy=0;else if(Math.abs(dy)>2*Math.abs(dx))dx=0;else{const d=Math.round(Math.max(Math.abs(dx),Math.abs(dy))/CELL)*CELL;dx=Math.sign(dx)*d;dy=Math.sign(dy)*d}
  return {x:f(a.x+dx),y:f(a.y+dy)}}
function nearestWall(w,max){let best=null,bd=max;for(const wl of S.walls){const r=segDist(w.x,w.y,wl);if(r.d<bd){bd=r.d;best={wall:wl,t:r.t}}}return best}
function buildDown(e,w){
  if(bTool==='hand'||e.button===1||e.button===2){drag={mode:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty,moved:false};stage.classList.add('pan');return}
  if(bTool==='measure'){measure={a:snapPt(w),b:snapPt(w)};drag={mode:'measure'};renderOverlay();return}
  if(bTool==='floor'||bTool==='erase'){const c=cellOf(w);drag={mode:'b-rect',a:c,b:c};renderOverlay();return}
  if(bTool==='brush'){drag={mode:'b-brush',pre:snapshot()};paintCircle(w.x,w.y,brushR,bMat);renderGround();renderLive();return}
  if(bTool==='wall'){const p=snapV(w);drag={mode:'b-wall',a:p,b:p};renderOverlay();return}
  if(bTool==='door'||bTool==='window'||bTool==='opening'){placeOpening(w);return}
  if(bTool==='pillar'){const p={x:Math.round(w.x*2)/2,y:Math.round(w.y*2)/2};mutate(()=>{const it=make('pillar');it.x=p.x;it.y=p.y;S.items.push(it)});toast('Pillar placed. Tables will keep their distance from it.');return}
  if(bTool==='remove'){removeAt(w);return}
}
function buildMove(e,w){
  if(drag.mode==='b-rect'){drag.b=cellOf(w);renderOverlay()}
  else if(drag.mode==='b-brush'){paintCircle(w.x,w.y,brushR,bMat);renderGround();renderLive()}
  else if(drag.mode==='b-wall'){drag.b=constrain(drag.a,snapV(w));renderOverlay()}
}
function buildUp(d){
  if(d.mode==='b-rect'){const er=bTool==='erase';
    const wd=(Math.abs(d.b.x-d.a.x)+1)*CELL,ht=(Math.abs(d.b.y-d.a.y)+1)*CELL;
    mutate(()=>setCells(d.a.x,d.a.y,d.b.x,d.b.y,er?'.':bMat));
    toast(er?`Cleared ${wd} × ${ht} m.`:`${MATS[bMat].name} floor, ${wd} × ${ht} m.`)}
  else if(d.mode==='b-brush'){pushUndo(d.pre);renderAll();renderPanel()}
  else if(d.mode==='b-wall'){const L=Math.hypot(d.b.x-d.a.x,d.b.y-d.a.y);if(L<.49){renderOverlay();return}
    mutate(()=>S.walls.push({id:'w'+(S.next++),x1:d.a.x,y1:d.a.y,x2:d.b.x,y2:d.b.y}));toast(`Wall, ${r1(L)} m.`)}
}
function placeOpening(w){
  const nw=nearestWall(w,1.2);if(!nw){toast(S.walls.length?'Tap on a wall to add it there.':'Draw some walls first, or use "Walls around the floor".');return}
  const wl=nw.wall,L=Math.hypot(wl.x2-wl.x1,wl.y2-wl.y1),wd=bTool==='window'?1.5:bTool==='opening'?3:doorW;
  if(L<wd+.2){toast(`That wall is ${r1(L)} m, too short for a ${wd} m ${bTool}.`);return}
  let t=Math.max((wd/2+.1)/L,Math.min(1-(wd/2+.1)/L,nw.t));t=Math.round(t*L/CELL)*CELL/L;
  const clash=S.doors.some(o=>o.wall===wl.id&&Math.abs(o.t*L-t*L)<(o.wd+wd)/2);
  if(clash){toast('Something is already there. Pick another spot on the wall.');return}
  mutate(()=>S.doors.push({id:'o'+(S.next++),wall:wl.id,t:f(t),wd,kind:bTool}));
}
function removeAt(w){
  let bo=null,bd=1;for(const o of S.doors){const wl=S.walls.find(x=>x.id===o.wall);if(!wl)continue;const x=wl.x1+(wl.x2-wl.x1)*o.t,y=wl.y1+(wl.y2-wl.y1)*o.t,d=Math.hypot(x-w.x,y-w.y);if(d<Math.max(bd,o.wd/2)){bd=d;bo=o}}
  if(bo){mutate(()=>{S.doors=S.doors.filter(o=>o!==bo)});toast(`${bo.kind[0].toUpperCase()+bo.kind.slice(1)} removed.`);return}
  const nw=nearestWall(w,.45);if(nw){mutate(()=>{S.walls=S.walls.filter(x=>x!==nw.wall);S.doors=S.doors.filter(o=>o.wall!==nw.wall.id)});toast('Wall removed.');return}
  const pil=S.items.find(i=>i.type==='pillar'&&Math.abs(i.x-w.x)<=i.w/2+.2&&Math.abs(i.y-w.y)<=i.h/2+.2);
  if(pil){mutate(()=>{S.items=S.items.filter(i=>i!==pil)});toast('Pillar removed.');return}
  toast('Tap a wall, door, window or pillar to remove it. Use Erase for floor.');
}
function buildOverlay(k){

function parseCSV(t){
  const first=t.split(/\r?\n/)[0]||'',d=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const rows=[];let row=[],cur='',q=false;

const PRI={1:'Immediate family',2:'Close family',3:'VIP and relatives',4:'Friends',5:'Colleagues'};
function normName(n){return String(n||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^\p{L}\p{N}' ]/gu,' ').replace(/\s+/g,' ').trim()}
function inferGuest(g){
  const m=/^(.+?)['’]s\s+(.+)$/i.exec(g.name);
  if(m){if(!g.hh)g.hh=m[1].replace(/\s*\(.*\)\s*/,' ').trim();if(!g.rel)g.rel=m[2]}
  const txt=g.name+' '+(g.rel||'');
  if(!g.kid&&/\b(child|kid|son|baby|toddler)\b|طفل|ابن/i.test(txt)){g.kid=true}
  if(g.kid&&!g.meal)g.meal='Kids';
  if(/\b(child|kid|son|daughter|guest|plus one)\s*\d+\b|\+1/i.test(g.name))g.confirm=true;
  if(!g.pri){const gr=(g.group||'').toLowerCase();g.pri=/immediate|parent|sibling/.test(gr)?1:/family|side|aunt|uncle|cousin|عائلة/.test(gr)?2:/work|colleague|office|شغل/.test(gr)?5:/friend|صحاب/.test(gr)?4:3}
}
function hhKey(g){return normName(g.hh||g.name)+'|'+g.side}
function limitMax(){return Math.floor(S.plan.cap*(1+S.plan.extra/100))}
function countSide(sd){return S.guests.filter(g=>g.rsvp!=='no'&&g.side===sd).length}
function occupied(t){let n=0;for(let i=0;i<t.seats;i++)if(seatMap[t.id+':'+i])n++;return n}
function freeSeats(t){return t.seats-(t.reserve||0)-occupied(t)}

function tablePri(t){const ps=guestsAt(t).filter(Boolean).map(g=>g.pri||3);return ps.length?Math.min(...ps):(t.pri||9)}
function tableGroup(t){const c={};guestsAt(t).forEach(g=>{if(g&&g.group)c[g.group]=(c[g.group]||0)+1});const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);return e.length?e[0][0]:''}

function coupleFocus(){
  const k=S.items.find(i=>i.type==='kosha')||S.items.find(i=>i.type==='head')||S.items.find(i=>i.type==='stage');
  const F=frame();if(!k){const p=F.P(.5,3);return {x:p.x,y:p.y,rot:F.rot,k:null}}
  const r=rad(k.rot);return {x:k.x-Math.sin(r)*(k.h/2+2),y:k.y+Math.cos(r)*(k.h/2+2),rot:k.rot,k};

function orderUnit(list){ // head first, then partner/adults, then children, so families sit side by side
  return list.slice().sort((a,b)=>{const ha=normName(a.name)===normName(a.hh||a.name)?0:1,hb=normName(b.name)===normName(b.hh||b.name)?0:1;return (a.kid-b.kid)||(ha-hb)})}

  const n=list.length,free=[];for(let i=0;i<t.seats;i++)if(!seatMap[t.id+':'+i])free.push(i);
  let run=null;const circ=TYPES[t.type].shape==='round';
  for(let st=0;st<t.seats&&!run;st++){const r=[];for(let k=0;k<n;k++){const i=circ?(st+k)%t.seats:st+k;if(i>=t.seats||seatMap[t.id+':'+i])break;r.push(i)}if(r.length===n)run=r}
  const pick=run||free.slice(0,n);

function newTable(size,side,pri,title){

  if(gl.length>1){t.title=`${gl[0]} & ${gl[1]}`;return}
  const shared=S.items.filter(x=>x!==t&&TYPES[x.type].table&&guestsAt(x).some(g=>g&&(g.group||(SIDES[g.side]+"'s side"))===gl[0])).length;
  const heads=[...new Set(gs.filter(g=>!g.kid).map(g=>(g.hh||g.name).replace(/\s*\(.*\)/,'')))];
  t.title=shared&&heads.length?`${gl[0]}, ${heads.slice(0,3).join(heads.length>2?', ':' & ')}`:gl[0];

function smartDistribute(opts){
  opts=Object.assign({reseat:false,create:true,arrange:false},opts);
  const before=S.guests.filter(g=>g.t).length;let made=0;
  mutate(()=>{
    computeSeatMap();

    for(const t of S.items.filter(i=>TYPES[i.type].table)){const gr=[...new Set(guestsAt(t).filter(Boolean).map(g=>g.group||(SIDES[g.side]+"'s side")))];if(gr.length)t.groups=gr}
    if(opts.reseat){S.guests.forEach(g=>{g.t=null;g.s=null});S.items.forEach(t=>{if(TYPES[t.type].table&&!/^Bride's side \d+$/.test(t.title||''))t.autoTitle=true})}
    computeSeatMap();

    const todo=S.guests.filter(g=>!g.t&&g.rsvp!=='no');
    const H={};for(const g of todo)(H[hhKey(g)]=H[hhKey(g)]||[]).push(g);

function arrangeTables(){
  const tabs=S.items.filter(i=>TYPES[i.type].table&&!i.locked);if(!tabs.length)return;
  const F=coupleFocus(),r=rad(F.rot),rx=Math.cos(r),ry=Math.sin(r);
  const orig=tabs.map(t=>[t,t.x,t.y]);tabs.forEach(t=>{t.x=-999;t.y=-999});
  const W=S.venue.w,H=S.venue.h,cands=[];
  for(let y=.5;y<H;y+=.5)for(let x=.5;x<W;x+=.5)cands.push({x,y,d:Math.hypot(x-F.x,y-F.y),u:(x-F.x)*rx+(y-F.y)*ry});
  cands.sort((a,b)=>a.d-b.d);
  const aisle0=S.venue.aisle;S.venue.aisle=aisle0+(showNames?1.2:.3); // leave room for the names written round each table
  const num=t=>+tableNo(t)||99;
  const order=tabs.slice().sort((a,b)=>tablePri(a)-tablePri(b)||num(a)-num(b));
  for(const t of order){
    const sd=tableSide(t)||t.side,sg=sd==='groom'?-1:sd==='bride'?1:0;let ok=false;
    for(const pass of [0,1]){
      for(const c of cands){if(pass===0&&sg&&c.u*sg<.5)continue;
        t.x=f(c.x);t.y=f(c.y);if(canPlace(t)){ok=true;break}}
      if(ok)break}
    if(!ok){const o=orig.find(x=>x[0]===t);t.x=o[1];t.y=o[2]}

  S.venue.aisle=aisle0;
}

/* insights: the planner looks at the whole plan and suggests the next best move */
function insights(){

  const split=Object.entries(H).filter(([,v])=>v.size>1).map(([k])=>k.split('|')[0]);
  if(split.length)out.push({l:'warn',t:`${split.length} ${split.length===1?'family is':'families are'} split across tables: ${split.slice(0,3).map(x=>x.replace(/\b\w/g,c=>c.toUpperCase())).join(', ')}${split.length>3?'…':''}.`,b:'Reunite',f:reunite});

  if(lone.length)out.push({l:'warn',t:`${lone.length} ${lone.length===1?'child sits':'children sit'} away from their parents: ${lone.slice(0,3).map(g=>g.name).join(', ')}.`,b:'Reunite',f:reunite});

  if(kids)out.push({l:'ok',t:`${kids} children on the list. Ask the venue for ${kids} kids' meals and a few high chairs.`});
  if(nomeal&&nomeal<coming.length)out.push({l:'tip',t:`${nomeal} guests have no meal chosen yet.`});
  if(conflicts.size)out.push({l:'err',t:`${conflicts.size} layout ${conflicts.size===1?'issue':'issues'}: tables too close, against a wall, or off the floor.`,b:'Show',f:cycleIssue});
  if(!out.some(o=>o.l==='err'||o.l==='warn'))out.unshift({l:'ok',t:'Everything checks out. Every family sits together and nobody is waiting for a seat.'});
  return out;
}
function reunite(){

/* ---------- change a table's shape, guests included ---------- */
const SHAPES=[['round','Round','r10'],['square','Square','sq8'],['rect','Rectangle','rect8'],['banquet','Banquet','ban'],['head','Head table','head']];
function shapeOf(t){if(t.type==='round')return 'round';if(t.type==='head')return 'head';if(t.type==='banquet')return 'banquet';return Math.abs(t.w-t.h)<.05?'square':'rect'}
function reshapeTable(t,shape){
  computeSeatMap();
  const gs=guestsAt(t).map((g,i)=>g).filter(Boolean);           // in current seat order, so families stay side by side
  const n=Math.max(t.seats,gs.length+(t.reserve||0),shape==='head'?1:2);
  const r=s=>Math.round(s*10)/10;
  if(shape==='round'){t.type='round';t.w=t.h=roundFor(n)}
  else if(shape==='square'){t.type='rect';const L=Math.max(.9,r(Math.ceil(n/4)*.6));t.w=t.h=L}
  else if(shape==='rect'){t.type='rect';t.w=Math.max(1.2,r(Math.ceil(n/2)*.6));t.h=.9}
  else if(shape==='banquet'){t.type='banquet';t.w=Math.max(2,r(Math.ceil(n/2)*.6));t.h=1.2}
  else if(shape==='head'){t.type='head';t.w=Math.max(1.2,r(n*.6));t.h=.9}
  // grow a little if the chair maths comes up short
  let guard=0;while(seatCap(t)<n&&guard++<20){if(shape==='round'){t.w=t.h=r(t.w+.1)}else if(shape==='square'){t.w=t.h=r(t.w+.3)}else t.w=r(t.w+.3)}
  t.seats=Math.min(seatCap(t),n);
  gs.forEach((g,i)=>{g.t=t.id;g.s=i});
  computeSeatMap();
  // keep walkway clearance: nudge to the nearest free spot if the new footprint collides
  let moved=false;if(!canPlace(t)){const x=t.x,y=t.y;if(placeFree(t,x,y)){moved=Math.hypot(t.x-x,t.y-y)>.01}else{t.x=x;t.y=y}}
  return {n:gs.length,moved};
}
function changeShape(tabs,shape){
  let moved=0,guests=0;
  mutate(()=>{for(const t of tabs){if(t.locked)continue;const r=reshapeTable(t,shape);guests+=r.n;if(r.moved)moved++}});
  const name={round:'round table',square:'square table',rect:'rectangular table',banquet:'banquet table',head:'head table'}[shape];
  logAct(`${tabs.length>1?`${tabs.length} tables are now ${name}s`:tableName(tabs[0])+' is now a '+name}, with all ${guests} guests still in their places${moved?`. Moved ${moved===1?'it':moved+' of them'} slightly to keep the walkways clear`:''}.`);
}

document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName),mod=e.ctrlKey||e.metaKey;
  if($('#chart').classList.contains('open')){if(e.key==='Escape')closeChart();return}
  if($('#imp').classList.contains('open')){if(e.key==='Escape')closeImport();return}
  if($('#sheetM').classList.contains('open')){if(e.key==='Escape'&&!/INPUT|SELECT/.test(document.activeElement.tagName))closeSheet();else if(e.key==='Escape')document.activeElement.blur();
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT/.test(document.activeElement.tagName)){e.preventDefault();e.shiftKey?redo():undo();renderSheet()}return}
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return}
  if(typing)return;
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSel();return}
  if(mod&&e.key.toLowerCase()==='a'){e.preventDefault();sel=new Set(S.items.filter(i=>!TYPES[i.type].zone).map(i=>i.id));renderOverlay();setTab('edit');return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();if(selSeat&&seatMap[selSeat.tid+':'+selSeat.s]){unseat(seatMap[selSeat.tid+':'+selSeat.s].id);return}deleteSel();return}
  if(e.key==='Escape'){if(placing){stopPlacing();return}measure=null;sel=new Set();selSeat=null;renderItems();renderOverlay();renderPanel();return}
  if(e.key.toLowerCase()==='r'&&sel.size){const d=e.shiftKey?-15:15;if(sel.size===1){const it=selItems()[0];if(!it.locked)mutate(()=>{it.rot=normRot(it.rot+d)})}else rotateGroup(d);return}
  const arrows={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(arrows[e.key]&&sel.size){e.preventDefault();const st=e.shiftKey?1:.1,[ax,ay]=arrows[e.key];mutate(()=>{for(const i of selItems())if(!i.locked){i.x=f(i.x+ax*st);i.y=f(i.y+ay*st)}})}
  if(e.key==='m')setTool(tool==='measure'?'select':'measure');
  if(e.key==='f')fit();
  if(e.key==='n')$('#bNames').click();
});

        <div class="two"><div class="row"><input class="fld" data-gf-rel placeholder="Relationship" value="${esc(g.rel)}"></div><div class="row"><input class="fld" data-gf-hh placeholder="Household (sits together)" value="${esc(g.hh)}"></div></div>
        <div class="two"><div class="row"><select data-gf-pri aria-label="Priority">${Object.entries(PRI).map(([k,v])=>`<option value="${k}" ${+g.pri===+k?'selected':''}>${v}</option>`).join('')}</select></div><label class="check" style="margin:0"><input type="checkbox" data-gf-kid ${g.kid?'checked':''}> Child</label></div>
        <div class="row"><input class="fld" data-gf-notes placeholder="Notes, e.g. wheelchair, near the exit" value="${esc(g.notes)}"></div>
        ${g.rsvp==='no'&&g.t?'<p class="warn">Marked not coming but still has a seat.</p>':''}
        <div class="btns">${g.t?`<button class="btn sm" data-gunseat="${g.id}">Free the seat</button>`:''}<button class="btn sm danger" data-gdel="${g.id}">Remove guest</button></div></div>`:''}
    </li>`;
  }
  ul.innerHTML=h||(S.guests.length?'<li class="cap" style="padding:10px 0">No guests match.</li>':'');
  ul.querySelectorAll('[data-gtoggle]').forEach(x=>x.onclick=()=>{openGuest=openGuest===x.dataset.gtoggle?null:x.dataset.gtoggle;renderGuestList()});
  ul.querySelectorAll('[data-gplace]').forEach(x=>x.onclick=()=>startPlacing(x.dataset.gplace));
  ul.querySelectorAll('[data-gfind]').forEach(x=>x.onclick=()=>findGuest(x.dataset.gfind));
  ul.querySelectorAll('[data-gunseat]').forEach(x=>x.onclick=()=>unseat(x.dataset.gunseat));
  ul.querySelectorAll('[data-gdel]').forEach(x=>x.onclick=()=>{const id=x.dataset.gdel;mutate(()=>{S.guests=S.guests.filter(g=>g.id!==id)});openGuest=null});
  ul.querySelectorAll('li[data-g]').forEach(li=>{
    li.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/guest',li.dataset.g);e.dataTransfer.effectAllowed='move'});
    const g=gById(li.dataset.g);const ed=li.querySelector('.gedit');if(!ed)return;
    const bind=(sel,key)=>{const el=ed.querySelector(sel);if(el)el.addEventListener('change',()=>{mutate(()=>{g[key]=key==='name'?(el.value.trim()||g.name):el.value})})};
    bind('[data-gf-name]','name');bind('[data-gf-side]','side');bind('[data-gf-rsvp]','rsvp');bind('[data-gf-meal]','meal');bind('[data-gf-group]','group');bind('[data-gf-notes]','notes');bind('[data-gf-rel]','rel');bind('[data-gf-hh]','hh');
    const pr=ed.querySelector('[data-gf-pri]');if(pr)pr.addEventListener('change',()=>mutate(()=>{g.pri=+pr.value}));
    const kd=ed.querySelector('[data-gf-kid]');if(kd)kd.addEventListener('change',()=>mutate(()=>{g.kid=kd.checked;if(g.kid&&!g.meal)g.meal='Kids'}));
    const nm=ed.querySelector('[data-gf-name]');if(nm)nm.addEventListener('change',()=>{g.confirm=false});
  });
}
function refreshEditValues(){
  if(tab!=='edit'||sel.size!==1)return;const it=selItems()[0];if(!it)return;
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&document.activeElement!==el)el.value=v};
  set('fW',it.w);set('fH',it.h);set('fS',it.seats);set('fRot',it.rot);set('fRotN',it.rot);set('fX',it.x);set('fY',it.y);
  const fs=$('#fS');if(fs){fs.max=seatCap(it);const cn=$('#capNote');if(cn&&!TYPES[it.type].standing)cn.textContent=`up to ${seatCap(it)}`}
}

/* ---------- boot ---------- */
function migrate(d){
  d.plan=d.plan||{cap:100,extra:10,bride:50,groom:60};
  (d.guests||[]).forEach(g=>{g.rel=g.rel||'';g.hh=g.hh||'';g.kid=!!g.kid;g.confirm=!!g.confirm;if(!g.pri){const gr=(g.group||'').toLowerCase();g.pri=/immediate/.test(gr)?1:/family|side/.test(gr)?2:/work|colleague/.test(gr)?5:/friend/.test(gr)?4:3}});
  d.walls=d.walls||[];d.doors=d.doors||[];
  if(!d.floor||!Array.isArray(d.floor.rows)){const keep=S;S=d;d.floor=makeFloor('d');S=keep}
  d.guests=d.guests||[];d.gnext=d.gnext||(d.guests.length+1);d.venue.couple=d.venue.couple||'';
  for(const i of d.items){if(i.title==null)i.title='';if(i.color==='white'&&!LINENS.white)i.color='ivory';if(!TYPES[i.type].table&&i.label&&!i.title){i.title=i.label;i.label=''}}
  return d;
}
function defaultLayout(){
  S=blankState();const W=S.venue.w,H=S.venue.h;
  fillRect(0,0,W,3,'g');
  S.items.push(make('pool',{x:W-9.5,y:H-6.5,w:16,h:8}));
  applyTemplate('wedding');undoStack=[];redoStack=[];
}
const th=lsGet('tolipPlanner.theme');if(th)document.documentElement.setAttribute('data-theme',th);
let loaded=null;try{loaded=JSON.parse(lsGet(LS_AUTO)||'null')}catch(e){}
if(!loaded){try{const v2=JSON.parse(lsGet('tolipPlanner.auto.v2')||'null');if(v2&&v2.venue)loaded=v2}catch(e){}}
if(loaded&&loaded.venue&&Array.isArray(loaded.items))S=migrate(loaded);else defaultLayout();
if(!(S.preloads||[]).includes('groom56'))runPreload();
$('#bWalk').setAttribute('aria-pressed',!!S.venue.walk);
renderAll();renderPanel();requestAnimationFrame(fit);
let rT=null;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(applyView,100)});
})();
</script>
</body>
</html>
